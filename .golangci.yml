version: "2"

linters:
  default: none
  enable:
    - errcheck        # check for unchecked errors
    - govet           # go vet checks
    - ineffassign     # detect ineffectual assignments
    - misspell        # spell-check comments and strings
    - revive          # fast, configurable linter (replaces golint)
    - staticcheck     # comprehensive static analysis
    - unused          # detect unused code
    - godot           # doc comments must end with a period
    - nilerr          # return nil instead of errors.New("")
    - unconvert       # remove unnecessary type conversions
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
        - name: var-naming
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
    godot:
      scope: declarations
      period: true
    misspell:
      locale: US
  exclusions:
    rules:
      # Allow TODO comments that reference issue numbers.
      - text: "TODO\\(#\\d+\\)"
        linters: [godot]
      # Test files may use unexported helpers freely.
      - path: "_test\\.go"
        linters: [revive]
      # LUSTRE/Lustre/lustre is the official AWS FSx file system type name (based on the
      # Lustre parallel file system technology); it is not a misspelling of "luster".
      - text: "[Ll][Uu][Ss][Tt][Rr][Ee]"
        linters: [misspell]
      # "Resouce" is AWS's own typo in NoSuchConfigRuleException's message text, which
      # substrate reproduces verbatim so a consumer matching on the message matches.
      # Correcting it here would make substrate's message differ from the service's.
      - text: "Resouce"
        linters: [misspell]
      # EC2 spells two of the CapacityReservation state values "cancelled" and "cancelling".
      # They are wire values, not prose: substrate must answer AWS's spelling, and the
      # comments that explain the state machine have to name the values they describe.
      # Scoped to the Capacity Reservation files so a genuine misspelling anywhere else is
      # still caught.
      - path: "ec2_capacity_reservation"
        text: "cancell"
        linters: [misspell]

formatters:
  enable:
    - gofmt           # enforce gofmt formatting
    - goimports       # enforce goimports import grouping

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
