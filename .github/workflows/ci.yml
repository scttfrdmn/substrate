name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.26 is the toolchain go.mod pins; 1.27 is what a contributor on a current
        # release actually has installed. Only 1.26 ran until #787, so two
        # encoding/json v2 behaviour changes made main red on a clean checkout for
        # three weeks without CI noticing.
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          go build -ldflags "-X main.version=${VERSION} -X github.com/scttfrdmn/substrate/emulator.Version=${VERSION}" ./cmd/substrate

  version-stamping:
    name: Version Stamping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A -X flag naming a symbol that does not exist links cleanly and leaves the
      # variable at its default, so a wrong path is invisible until someone curls
      # /health on a released image (#402). Assert the observable outcome.
      - name: Check the build stamps the version the server reports
        run: make version-check

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Verify rather than repair: `go mod tidy` here would fix a stale go.mod
      # in-flight and report green, leaving the committed file broken for anyone
      # running the suite locally.
      - name: Check e2e module is tidy
        run: |
          cd test/e2e
          cp go.mod go.mod.orig && cp go.sum go.sum.orig
          go mod tidy
          diff go.mod go.mod.orig && diff go.sum go.sum.orig || {
            echo "::error::test/e2e go.mod/go.sum are stale — run 'cd test/e2e && go mod tidy' and commit"
            exit 1
          }

      - name: Run E2E tests
        run: cd test/e2e && go test -v -race ./...

  docs-reference:
    name: Service Reference Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Before the matrix check, because the matrix is rendered *from* the catalog: a
      # stale catalog would fail docs-reference-check with a message about the wrong
      # file. The catalog is generated from each plugin's dispatch switch, so this is
      # what makes a newly routed operation impossible to leave out of it (#1095).
      - name: Check the operation catalog is in sync with the plugins' dispatch
        run: make operation-catalog-check

      - name: Check docs/services.md is in sync with the plugin registry
        run: make docs-reference-check

      # The check above compares the generated matrix, not the hand-written prose, so a
      # section copied in twice passes it. #1384 shipped 41 duplicated sections that way.
      - name: Check docs/services.md names each service section once
        run: make docs-headings-check

      # The matrix check above compares operation *counts*; this compares the operations
      # themselves against each service's hand-written table, in both directions. It runs
      # in CI and not only in `make` for the reason the wire-bookkeeping baseline does: an
      # inventory nothing executes is a TODO list, and a routed operation documented
      # nowhere has to fail a PR rather than wait to be noticed (#1015).
      - name: Check every routed operation has a row, and every row a routed operation
        run: make operation-docs-check

      # Offline: regenerates from the vendored snapshots under emulator/authzref and
      # diffs. A refreshed snapshot committed without regenerating would leave the
      # authorization table disagreeing with its own source.
      - name: Check the authorization reference table is in sync with its snapshots
        run: make authz-reference-check

  # Pure bash and awk, so no toolchain: the check is lexical by construction (see
  # scripts/check-wire-bookkeeping.sh for why it cannot be a reachability check).
  # It runs here rather than only in `make` because a baseline that nothing
  # executes is not a ratchet — it is a TODO list, and #756's whole complaint is
  # that the inventory had never been taken. A new bookkeeping field with a
  # wire-visible json tag must fail a PR, not wait for someone to run a target.
  #
  # It asserts three files: the declaration baseline;
  # scripts/wire-bookkeeping-projected.txt, whose entries each cite the test that
  # proves their record cannot reach a response body; and
  # scripts/wire-bookkeeping-internal.txt, whose entries each name the reader or
  # route that keeps a record off every AWS response. Both references are checked
  # by grep, which is why this still needs no Go toolchain — a renamed test or a
  # removed route fails here without the suite running.
  wire-bookkeeping:
    name: Wire Bookkeeping Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check no bookkeeping field has gained wire-visible ground
        run: make wire-bookkeeping-check

  python:
    name: Python (pytest-substrate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build substrate binary
        run: go build -o bin/substrate ./cmd/substrate

      - name: Install pytest-substrate and tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff build
          # [test] pulls boto3, without which the botocore-driven CloudWatch tests skip
          # silently and the JSON path goes uncovered again.
          pip install -e './python[test]'

      - name: Lint (ruff)
        run: ruff check python/src python/tests

      - name: Test (pytest)
        env:
          SUBSTRATE_BINARY: ${{ github.workspace }}/bin/substrate
        run: cd python && pytest tests/ -v

      - name: Build wheel
        run: cd python && python -m build --wheel --outdir dist/

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: go test -bench=. -benchmem -benchtime=3s ./... | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.txt
