name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.26 is the toolchain go.mod pins; 1.27 is what a contributor on a current
        # release actually has installed. Only 1.26 ran until #787, so two
        # encoding/json v2 behaviour changes made main red on a clean checkout for
        # three weeks without CI noticing.
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          go build -ldflags "-X main.version=${VERSION} -X github.com/scttfrdmn/substrate/emulator.Version=${VERSION}" ./cmd/substrate

  version-stamping:
    name: Version Stamping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A -X flag naming a symbol that does not exist links cleanly and leaves the
      # variable at its default, so a wrong path is invisible until someone curls
      # /health on a released image (#402). Assert the observable outcome.
      - name: Check the build stamps the version the server reports
        run: make version-check

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Verify rather than repair: `go mod tidy` here would fix a stale go.mod
      # in-flight and report green, leaving the committed file broken for anyone
      # running the suite locally.
      - name: Check e2e module is tidy
        run: |
          cd test/e2e
          cp go.mod go.mod.orig && cp go.sum go.sum.orig
          go mod tidy
          diff go.mod go.mod.orig && diff go.sum go.sum.orig || {
            echo "::error::test/e2e go.mod/go.sum are stale — run 'cd test/e2e && go mod tidy' and commit"
            exit 1
          }

      - name: Run E2E tests
        run: cd test/e2e && go test -v -race ./...

  # Real Terraform and the real CDK CLI against substrate (#1519, #1520). Each journey's recording
  # is replayed into a second fresh deterministic-run server, with every response body diffed
  # (#1628). The tools
  # and their plugins are fetched in the setup steps, which are the only ones that use the
  # network: the journeys install the AWS provider from TF_PLUGIN_CACHE_DIR as a filesystem
  # mirror and run the CDK CLI examples/cdk's lockfile pins.
  iac-e2e:
    name: IaC Journeys (Terraform, CDK)
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5
          # The wrapper rewrites stdout and exit codes, and `plan -detailed-exitcode` is how
          # the journey checks convergence.
          terraform_wrapper: false

      # Node 24 runs examples/cdk/bin/app.ts directly, stripping its types itself.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/cdk/package-lock.json

      - name: Cache the Terraform AWS provider
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('examples/terraform/.terraform.lock.hcl') }}
          # After a provider bump the old cache still holds the older version, which
          # `terraform init` leaves alone and adds the new one beside.
          restore-keys: terraform-providers-${{ runner.os }}-

      - name: Fetch the AWS provider and the CDK app's packages
        run: make iac-e2e-setup

      - name: Run the Terraform and CDK journeys
        run: make iac-e2e

  docs-reference:
    name: Service Reference Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Before the matrix check, because the matrix is rendered *from* the catalog: a
      # stale catalog would fail docs-reference-check with a message about the wrong
      # file. The catalog is generated from each plugin's dispatch switch, so this is
      # what makes a newly routed operation impossible to leave out of it (#1095).
      - name: Check the operation catalog is in sync with the plugins' dispatch
        run: make operation-catalog-check

      # Also checks that every frozen legacy /services#<anchor> still lands on its page,
      # and that every link between docs pages names an anchor the page has (#1610).
      - name: Check the service reference index and sidebar are in sync with the plugin registry
        run: make docs-reference-check

      # The check above compares the generated matrix, not the hand-written prose, so a
      # section copied in twice passes it. #1384 shipped 41 duplicated sections that way.
      - name: Check each reference page has one unique title and no repeated section
        run: make docs-headings-check

      # The matrix is the one place a plugin or operation count can be stated, because it
      # is the one place a generator keeps it true. The README and docs/index.md said 63
      # plugins while the registry had 68 (#1604). It runs here rather than in docs-ci.yml
      # because that workflow's paths filter covers docs/** and README.md but neither
      # python/README.md, which the check also scans, nor scripts/check-doc-counts.sh, so
      # an edit to either would skip it there. This job runs on every PR, so no paths
      # entry is needed to keep it from being skipped.
      - name: Check no prose outside the matrix pins a plugin or operation count
        run: make docs-counts-check

      # The matrix check above compares operation *counts*; this compares the operations
      # themselves against each service's hand-written table, in both directions. It runs
      # in CI and not only in `make` for the reason the wire-bookkeeping baseline does: an
      # inventory nothing executes is a TODO list, and a routed operation documented
      # nowhere has to fail a PR rather than wait to be noticed (#1015).
      - name: Check every plugin has a reference page, every routed operation a row, and every row a routed operation
        run: make operation-docs-check

      # Offline: regenerates from the vendored snapshots under emulator/authzref and
      # diffs. A refreshed snapshot committed without regenerating would leave the
      # authorization table disagreeing with its own source.
      - name: Check the authorization reference table is in sync with its snapshots
        run: make authz-reference-check

      # The CloudFormation resource specification decides which resource types a template may
      # declare and which properties each takes (#1605). Offline, like the authz check: the
      # snapshot is vendored and only `make cfn-schema-fetch`, run by hand, touches the network.
      - name: Check the CloudFormation schema table is in sync with its snapshot
        run: make cfn-schema-check

      # A doc link to a renamed or deleted identifier still compiles and still reads as
      # authoritative (#1609). It needs the Go toolchain, so it runs here rather than in
      # the wire-bookkeeping job with the other comment gate.
      - name: Check every doc link in a Go comment names an identifier
        run: make doc-links-check

  # Pure bash and awk, so no toolchain: the check is lexical by construction (see
  # scripts/check-wire-bookkeeping.sh for why it cannot be a reachability check).
  # It runs here rather than only in `make` because a baseline that nothing
  # executes is not a ratchet — it is a TODO list, and #756's whole complaint is
  # that the inventory had never been taken. A new bookkeeping field with a
  # wire-visible json tag must fail a PR, not wait for someone to run a target.
  #
  # It asserts three files: the declaration baseline;
  # scripts/wire-bookkeeping-projected.txt, whose entries each cite the test that
  # proves their record cannot reach a response body; and
  # scripts/wire-bookkeeping-internal.txt, whose entries each name the reader or
  # route that keeps a record off every AWS response. Both references are checked
  # by grep, which is why this still needs no Go toolchain — a renamed test or a
  # removed route fails here without the suite running.
  wire-bookkeeping:
    name: Wire Bookkeeping Drift
    runs-on: ubuntu-latest
    steps:
      # Full history, so the comment-history step below can diff against the PR's base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check no bookkeeping field has gained wire-visible ground
        run: make wire-bookkeeping-check

      # The three discarded-error gates are lexical too, which is why they share this job.
      # errcheck treats `x, _ :=` and `_ =` as handled, so none of the rules can be stated
      # to a linter. The unmarshal gate (#1007) predates this step and was run only
      # through `make`; the marshal gate (#1365) and the state-write gate (#1175, #1192)
      # followed it.
      - name: Check no request body is decoded with its error discarded
        run: make discarded-unmarshal-check

      - name: Check no value is encoded with its error discarded
        run: make discarded-marshal-check

      - name: Check no state write has its error discarded
        run: make discarded-state-check

      # Lexical for the same reason: a linter cannot tell a handler's clock read from a
      # latency measurement, so every legitimate time.Now() and rand import is named in
      # the script's allowlist (#1600).
      - name: Check no handler reads the wall clock or a random source
        run: make nondeterminism-check

      # Lexical too, and it reads only the lines a PR adds, so the narrations already in
      # the tree are trimmed in batches rather than failing every PR (#1609). It runs on
      # pull requests only: main is PR-only, so every push to it is a squash of a PR this
      # step already passed against the same base, and re-diffing HEAD~1 would add nothing.
      - name: Check no added comment narrates issue history
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: make comment-history-check

  python:
    name: Python ${{ matrix.python-version }} (pytest-substrate)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor pyproject.toml declares (requires-python >=3.11, #1466) and the
        # version lint and the wheel build run on, so the floor is tested rather than
        # merely declared.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build substrate binary
        run: go build -o bin/substrate ./cmd/substrate

      - name: Install pytest-substrate and tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff build
          # [test] pulls boto3, without which the botocore-driven CloudWatch tests skip
          # silently and the JSON path goes uncovered again.
          pip install -e './python[test]'

      - name: Lint (ruff)
        if: matrix.python-version == '3.12'
        run: ruff check python/src python/tests python/examples

      - name: Test (pytest)
        env:
          SUBSTRATE_BINARY: ${{ github.workspace }}/bin/substrate
        run: cd python && pytest tests/ examples/ -v

      - name: Build wheel
        if: matrix.python-version == '3.12'
        run: cd python && python -m build --wheel --outdir dist/

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: go test -bench=. -benchmem -benchtime=3s ./... | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.txt
